name: GCS Backend & Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'gcs/**'
      - '.github/workflows/gcs_ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'gcs/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd gcs/backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          cd gcs/backend
          pytest tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gcs/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd gcs/frontend
          npm ci

      - name: Typecheck and Build Frontend
        run: |
          cd gcs/frontend
          npm run build
